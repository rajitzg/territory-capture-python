# Territory Capture match configuration.
# Edit these values to change board size, visibility, turn count, respawn
# positions, or starting-territory shape without touching Java code.
# Loaded by territorygame.domain.GameConfig at startup.

board.width=50
board.height=50

# Full odd side length of the square visibility window centered on an agent.
visibility.windowSize=11

# Number of turns each player gets before the match ends.
turns.perPlayer=2000

# Milliseconds paused between turns while running continuously (Start),
# so a match is watchable instead of finishing instantly. Step always runs
# a single turn immediately, ignoring this value.
autoplay.turnDelayMillis=120

# Full odd side length of the square starting territory centered on each
# respawn position.
starting.territorySize=3

# Respawn positions, one per player, indexed from 0. respawn.count controls
# how many players are configured; add more respawn.N.x/respawn.N.y pairs
# to configure more respawn points (game rules currently assume exactly 2).
respawn.count=2
respawn.0.x=4
respawn.0.y=25
respawn.1.x=45
respawn.1.y=25

# Random seed for each player's slot, used by controllers that roll their
# own randomness (e.g. EnemyStateMachine's wandering). Two instances of the
# same bot in one match would otherwise start from the same default
# randomness and play out identically for long stretches; different seeds
# here keep them distinct. Set both to the same value to make a specific
# matchup reproducible for debugging.
controller.seed.0=1001
controller.seed.1=2002

# Cap on how many times a controller may be re-invoked within a single turn.
# Guards against a controller that can never produce a successful move (e.g.
# a cornered agent, or a bug that always returns INVALID): once the cap is
# hit, that turn is forfeited instead of the match hanging forever.
turn.maxAttemptsPerTurn=20
